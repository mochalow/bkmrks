# Зависимости проекта и их замок.
#
# Раньше зависимости жили в requirements.txt - полном транзитивном слепке,
# где все строки закреплены через `==`. Такой файл по форме замок, но по
# происхождению нет: его никто не генерировал, и ничто не проверяло, что
# набор внутренне непротиворечив. Обновление по одной строке за раз ломало
# его регулярно: pydantic в каждом релизе требует ровно свой pydantic-core,
# а anyio 4.15 подняла нижнюю границу typing-extensions - в обоих случаях
# установка падала на резолвере, пока спутник ехал отдельной правкой.
#
# Здесь разделены два разных утверждения. Ниже - только ограничения
# («не ниже такой-то версии») и только на то, что приложение импортирует
# само. Точные версии всего дерева, включая транзитивные, лежат в uv.lock,
# который собирает резолвер одной операцией и потому согласованным.
#
# Границы через `>=`, а не голые имена, ещё и по требованию Dependabot:
# пакет без ограничения в этом файле он в замке не двигает.

[project]
name = "bkmrks"
version = "0.2.0"
description = "Личная библиотека статей: сохранение, чтение, поиск"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.138.2",
    "pydantic>=2.13.4",
    "trafilatura>=2.1.0",
    "uvicorn>=0.49.0",
    # Дальше - содержимое экстры uvicorn[standard], перечисленное поштучно,
    # а не самой экстрой. Разница в одном пакете: websockets. Приложение
    # WebSocket не обслуживает, а uvicorn при ws="auto" грузит из него
    # реализацию, объявленную устаревшей (websockets.legacy). Возврат
    # зависимости ловит тест test_server_loads_no_websocket_implementation,
    # но ловит уже по факту - защита здесь, в списке.
    "httptools>=0.8.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvloop>=0.22.1",
    "watchfiles>=1.2.0",
]

[dependency-groups]
# Тестовый инструментарий. Группа dev ставится по умолчанию, в прод-образ
# не попадает: там `uv sync --no-dev`.
dev = [
    "pytest>=9.1.1",
    # httpx2, а не httpx: starlette предупреждает, что связка с httpx
    # устарела, и просит httpx2. Нужен для fastapi.testclient.
    "httpx2>=2.12.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    # Свойства вместо примеров: идемпотентность нормализации URL и тега
    # проверяется на генерируемых данных, а не на трёх строках таблицы.
    "hypothesis>=6.167.1",
    # Случайный порядок тестов - ловит скрытые зависимости между ними.
    "pytest-randomly>=4.1.0",
    # Дымовые E2E в браузере. После установки нужен один раз:
    #     uv run playwright install chromium
    # Без браузера сценарии пропускаются с причиной, набор остаётся зелёным.
    "pytest-playwright>=0.9.0",
]

# Сборка документации. Отдельной группой, а не отдельным файлом рядом со
# Sphinx: раньше docs/requirements.txt не видел ни один сторож зависимостей,
# и версии там не обновлялись бы никогда. Группа не ставится по умолчанию -
# нужна команда `uv sync --group docs`.
#
# Sphinx выполняет `import main`, поэтому ему нужны и зависимости проекта.
# В одном замке это получается само собой.
docs = [
    "sphinx>=8.2.3",
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
]

[tool.uv]
# Проект не пакет: main.py, parser.py и storage.py лежат в корне и
# импортируются по имени (отсюда `pythonpath = .` в pytest.ini). Без этого
# флага uv собирал бы дистрибутив и требовал build-backend.
package = false
