[pytest]
testpaths = tests
addopts = -q --strict-markers

# Предупреждения становятся ошибками: устаревание чужих библиотек
# замечается в день, когда новая версия приезжает, а не в день, когда
# оно превратится в поломку.
#
# Обещание работает ровно настолько, насколько версии вообще обновляются.
# Точные версии всего дерева, включая транзитивные, лежат в uv.lock, а
# новые привозит .github/dependabot.yml - без него эта строка обещает
# больше, чем делает.
#
# Ниже ровно одно исключение, и оно поимённое. starlette в testclient
# берёт псевдоним anyio.abc.BlockingPortal, объявленный устаревшим в
# anyio 4.15. Это чужой код в чужом файле: починить его здесь нельзя, а
# `error` без исключений означал бы, что набор не запускается вовсе.
#
# Правило при этом не ослаблено, а сужено: исключение опознаётся по
# тексту сообщения, то есть закрывает одно устаревание, а не класс
# DeprecationWarning целиком; задевает только тестовую обвязку, потому
# что starlette.testclient в main.py не импортируется. Надобность
# исключения стережёт test_the_anyio_deprecation_still_needs_its_exception:
# когда starlette перестанет печатать это сообщение, сторож покраснеет и
# потребует убрать строку.
filterwarnings =
    error
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning

markers =
    json_storage: привязан к файловому хранилищу; снимается вместе с ним на этапе 1
    e2e: дымовой сценарий в браузере; требует playwright install chromium

# Корень проекта в sys.path: main/parser/storage лежат в нём, а не в пакете.
# Без этого pytest добавляет только каталог tests/ и "import main" падает.
pythonpath = .
