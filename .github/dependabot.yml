# Обновление закреплённых версий.
#
# Закреплено в проекте всё: дерево зависимостей Python лежит в uv.lock,
# образы в Dockerfile закреплены тегом, экшены - по SHA. Само по себе это
# значит, что новая версия не приедет никогда, а обещание pytest.ini -
# «устаревание чужих библиотек замечается на CI» - исполнялось бы
# наполовину. Версии привозит этот файл.
#
# github-actions здесь ещё и единственный способ обновлять SHA: тег можно
# перевесить, SHA нельзя, поэтому вручную это делается только сверкой
# каждой строки с апстримом.
version: 2
updates:
  - package-ecosystem: uv
    # pyproject.toml и uv.lock лежат в корне. Группы dev и docs объявлены
    # там же, поэтому отдельного блока под документацию не нужно.
    directory: /
    schedule:
      interval: weekly
    # Одной группой, а не по пакету на PR. Причина не в шуме: каждое
    # обновление правит один и тот же uv.lock, и пять параллельных PR
    # означали бы, что мерж любого из них делает остальные четыре
    # устаревшими. Замок обновляется целиком - значит и приезжать должен
    # целиком, одним согласованным набором.
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: docker
    # Обе строки FROM в Dockerfile: базовый python и образ, из которого
    # берётся uv. До перехода на замок за базовым образом не следил никто.
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    # jsdoc для сборки документации по клиентскому JavaScript.
    directory: /docs
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
