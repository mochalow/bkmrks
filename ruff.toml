# Конфигурация линтера отдельным файлом, хотя pyproject.toml в проекте
# теперь есть. Там объявлены зависимости, и только они: этот файл правят
# Dependabot и человек одновременно, и настройкам инструментов в нём
# делать нечего.

target-version = "py312"
line-length = 100

[lint]
# Набор правил перечислен явно, а не унаследован от умолчаний ruff:
# умолчания меняются от версии к версии (в 0.16 они уже включают B, TRY,
# FURB, UP), и тогда апгрейд линтера красит CI без единой правки в коде.
#
# Стартовый набор - пиретики (E4/E7/E9), pyflakes (F) и сортировка
# импортов (I). Расширять по одному правилу за коммит, а не всё сразу:
# иначе линтер становится источником шума, а не подсказок.
select = ["E4", "E7", "E9", "F", "I"]
